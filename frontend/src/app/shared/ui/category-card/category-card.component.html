<a
  class="category-card"
  (click)="onClick()"
  [class]="
    'category-card ' + variant()
  "
  routerLink="/products"
>

  <div class="shape shape-one"></div>
  <div class="shape shape-two"></div>

  <div class="top">

    <div class="icon">
      <mat-icon>
        {{ icon() }}
      </mat-icon>
    </div>

    <div class="arrow">
      <mat-icon>
        north_east
      </mat-icon>
    </div>

  </div>


  <div class="content">

    <h3>
      {{ category.title }}
    </h3>

    <span>
      Смотреть товары
    </span>

  </div>

</a>
