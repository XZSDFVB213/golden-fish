<section class="hero-slider">
  <div class="slides">
    @for (slide of slides; track slide.title; let i = $index) {
      <article
        class="hero-slide"
        [class.active]="activeSlide() === i"
        [class.fish]="slide.variant === 'fish'"
        [class.seafood]="slide.variant === 'seafood'"
        [class.semi]="slide.variant === 'semi'"
      >
        <div class="hero-content">
          <h1>
            {{ slide.title }}

            <span>
              {{ slide.accent }}
            </span>
          </h1>

          <p>
            {{ slide.description }}
          </p>

          <a [routerLink]="slide.link" class="hero-button">
            {{ slide.button }}
          </a>
        </div>

        <div class="hero-visual">
          @if (slide.variant === "fish") {
            <div class="ice ice-1"></div>

            <div class="ice ice-2"></div>

            <div class="ice ice-3"></div>
          }

          <img [src]="slide.image" [alt]="slide.title" class="hero-image" />
        </div>
      </article>
    }
  </div>

  <!-- ARROWS -->

  <button
    type="button"
    class="slider-arrow previous"
    (click)="previous()"
    aria-label="Предыдущий баннер"
  >
    ‹
  </button>

  <button
    type="button"
    class="slider-arrow next"
    (click)="next()"
    aria-label="Следующий баннер"
  >
    ›
  </button>

  <!-- DOTS -->

  <div class="slider-dots">
    @for (slide of slides; track slide.title; let i = $index) {
      <button
        type="button"
        [class.active]="activeSlide() === i"
        (click)="goTo(i)"
        [attr.aria-label]="'Баннер ' + (i + 1)"
      ></button>
    }
  </div>
</section>
